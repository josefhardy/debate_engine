[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-engine"
version = "0.1.0"
description = "Does AI debate help a weaker judge find the truth? Experiments on QuALITY with retrieval-grounded debaters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
debate-run = "debate.run:main"
debate-analyze = "debate.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
